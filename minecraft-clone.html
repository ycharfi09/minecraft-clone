let mobIdCounter = 0;
function spawnMob(type, x, y, z){
  const mesh = createMobMesh(type);
  mesh.position.set(x, y, z);
  const mob = {id:'mob_'+(mobIdCounter++), type, mesh,
    vel:new THREE.Vector3(0,0,0), health:MOB_TYPES[type].health,
    state:'idle', wanderTimer:Math.random()*3, onGround:false, attackCooldown:0, provoked:false};
  mobs.push(mob);
  return mob;
}

function updateMobAI(mob, dt){
  const def = MOB_TYPES[mob.type];
  const pos = mob.mesh.position;
  const distToPlayer = pos.distanceTo(new THREE.Vector3(player.pos.x, player.pos.y+0.9, player.pos.z));

  if (def.hostile && mob.type==='chooper'){
    const isNight = worldTime > 0.75 || worldTime < 0.25;
    // Mimic block beneath during day
    if(!isNight && mob.state!=='provoked' && mob.state!=='chase'){
      const bx=Math.floor(pos.x), bz=Math.floor(pos.z);
      const by=Math.floor(pos.y-0.01);
      const blockId=getBlock(bx,by,bz);
      if(blockId && mob._mimicBlock!==blockId){
        mob._mimicBlock=blockId;
        const tex=BLOCKS[blockId]?.tex;
        const bodyMesh=mob.mesh.children.find(c=>c.name==='body');
        if(bodyMesh && tex){
          bodyMesh.material.map=atlasTex;
          bodyMesh.material.color.setHex(0xffffff);
          bodyMesh.material.needsUpdate=true;
          // Apply per-face textures: +x,-x,+y(top),-y(bot),+z,-z all use side except top/bottom
          const uvAttr=bodyMesh.geometry.getAttribute('uv');
          const faces=[tex.side,tex.side,tex.top,tex.bot,tex.side,tex.side];
          for(let f=0;f<6;f++){
            const tileIdx=faces[f]||0;
            const u=(tileIdx%ATLAS_W)/ATLAS_W, tv=1-(1+Math.floor(tileIdx/ATLAS_W))/ATLAS_H;
            for(let vi=0;vi<4;vi++){
              const idx=f*4+vi;
              const ou=uvAttr.getX(idx), ov=uvAttr.getY(idx);
              uvAttr.setXY(idx, u+ou/ATLAS_W, tv+ov/ATLAS_H);
            }
          }
          uvAttr.needsUpdate=true;
        }
      }
      mob.state='disguise';
      mob.vel.x=0; mob.vel.z=0;
      mob.mesh.children.forEach(c=>{ if(c.name==='eye') c.visible=false; });
    }
    // Provoked during day: chase the attacker briefly
    else if(mob.state==='provoked'){
      // Provoked: chase player forever until killed
      const dx=player.pos.x-pos.x, dz=player.pos.z-pos.z;
      const d=Math.sqrt(dx*dx+dz*dz);
      if(d>0.5){ mob.vel.x=(dx/d)*def.speed; mob.vel.z=(dz/d)*def.speed; mob.mesh.rotation.y=Math.atan2(dx,dz); }
      mob.mesh.children.forEach(c=>{ if(c.name==='eye') c.visible=true; });
      if(distToPlayer<1.5){
        if(!mob.attackCooldown||mob.attackCooldown<=0){ takeDamage(def.contactDamage,'Killed by Chooper'); mob.attackCooldown=1.0; }
      }
      if(isNight) mob.state='chase'; // becomes full chase at night
    }
    // Night: active chaser
    if(isNight){
      mob.mesh.children.forEach(c=>{ if(c.name==='eye') c.visible=distToPlayer<def.detectionRange||mob.state==='provoked'; });
      // Reset mimic
      if(mob._mimicBlock!==undefined){
        delete mob._mimicBlock;
        const bodyMesh=mob.mesh.children.find(c=>c.name==='body');
        if(bodyMesh){
          bodyMesh.material.map=null;
          bodyMesh.material.color.setHex(def.bodyColor);
          bodyMesh.material.needsUpdate=true;
        }
      }
      if(distToPlayer<def.detectionRange||mob.state==='provoked'){
        mob.state='chase';
        const dx=player.pos.x-pos.x, dz=player.pos.z-pos.z;
        const d=Math.sqrt(dx*dx+dz*dz);
        if(d>0.5){ mob.vel.x=(dx/d)*def.speed; mob.vel.z=(dz/d)*def.speed; mob.mesh.rotation.y=Math.atan2(dx,dz); }
        if(distToPlayer<1.5){
          if(!mob.attackCooldown||mob.attackCooldown<=0){ takeDamage(def.contactDamage,'Killed by Chooper'); mob.attackCooldown=1.0; }
        }
      } else if(mob.state!=='provoked'){ mob.state='idle'; mob.vel.x=0; mob.vel.z=0; }
    }
    if(mob.attackCooldown>0) mob.attackCooldown-=dt;
  } else {
    mob.wanderTimer-=dt;
    if(mob.wanderTimer<=0){
      if(Math.random()<0.3){ mob.state='idle'; mob.vel.x=0; mob.vel.z=0; mob.wanderTimer=2+Math.random()*4; }
      else{ mob.state='wander'; const a=Math.random()*Math.PI*2; mob.vel.x=Math.cos(a)*def.speed*0.5; mob.vel.z=Math.sin(a)*def.speed*0.5; mob.mesh.rotation.y=a+Math.PI/2; mob.wanderTimer=1+Math.random()*3; }
    }
    if(distToPlayer<4){
      const dx=pos.x-player.pos.x, dz=pos.z-player.pos.z;
      const d=Math.sqrt(dx*dx+dz*dz);
      if(d>0.1){ mob.vel.x=(dx/d)*def.speed; mob.vel.z=(dz/d)*def.speed; mob.mesh.rotation.y=Math.atan2(dx,dz); }
      mob.state='flee'; mob.wanderTimer=0.5;
    }
  }
}

function updateMobs(dt){
  for(let i=mobs.length-1;i>=0;i--){
    const mob=mobs[i];
    const def=MOB_TYPES[mob.type];
    const pos=mob.mesh.position;
    // Hit flash recovery
    if(mob.hitFlash>0){
      mob.hitFlash-=dt;
      if(mob.hitFlash<=0){
        mob.mesh.children.forEach(c=>{
          if(c.material && c._origColor!==undefined){ c.material.color.setHex(c._origColor); delete c._origColor; }
        });
      }
    }
    // Despawn if too far
    const dist=pos.distanceTo(new THREE.Vector3(player.pos.x,player.pos.y,player.pos.z));
    if(dist>RENDER_DIST*CHUNK_SIZE*1.5){ scene.remove(mob.mesh); mobs.splice(i,1); continue; }
    updateMobAI(mob,dt);
    mob.vel.y-=16*dt;
    // Horizontal movement with collision
    const nx=pos.x+mob.vel.x*dt, nz=pos.z+mob.vel.z*dt;
    if(!isSolid(Math.floor(nx),Math.floor(pos.y),Math.floor(pos.z))) pos.x=nx; else{ mob.vel.x=0; if(mob.onGround){ mob.vel.y=7; mob.vel.x*=0.5; } }
    if(!isSolid(Math.floor(pos.x),Math.floor(pos.y),Math.floor(nz))) pos.z=nz; else{ mob.vel.z=0; if(mob.onGround){ mob.vel.y=7; mob.vel.z*=0.5; } }
    const ny=pos.y+mob.vel.y*dt;
    if(!isSolid(Math.floor(pos.x),Math.floor(ny),Math.floor(pos.z))){ pos.y=ny; mob.onGround=false; }
    else{ if(mob.vel.y<0)mob.onGround=true; mob.vel.y=0; }
    if(pos.y<-10){ scene.remove(mob.mesh); mobs.splice(i,1); continue; }
    // Bobbing animation
    if(!def.hostile&&mob.state==='wander'){
      const baseY=mob.type==='reindeer'?1.0:(def.tall?1.2:0.7);
      mob.mesh.children[0].position.y=baseY+Math.sin(performance.now()*0.005+i)*0.03;
    }
  }
}

function attackMob(mob){
  let damage=1;
  if(player.gameMode==='survival'){
    const slot=inventory[selectedSlot];
    if(slot){
      const td=BLOCKS[slot.id];
      if(td&&td.tool==='sword') damage=3+td.tier;
      else if(td&&td.tool==='axe') damage=2+td.tier*0.5;
    }
  } else damage=10;
  mob.health-=damage;
  // Hit flash
  mob.hitFlash=0.15;
  const flashColor=mob.type==='sheep'?0xff3333:0xffffff;
  mob.mesh.children.forEach(c=>{
    if(c.material && c.name!=='eye'){
      c._origColor=c.material.color.getHex();
      c.material.color.setHex(flashColor);
    }
  });
  // If chooper and daytime, provoke it
  if(mob.type==='chooper' && mob.state!=='chase') mob.state='provoked';
  const kb=new THREE.Vector3(player.pos.x-mob.mesh.position.x,0,player.pos.z-mob.mesh.position.z).normalize().multiplyScalar(-3);
  kb.y=2; mob.vel.add(kb);
  if(mob.health<=0) killMob(mob);
  if(mpMode!=='none') mpSend({type:'mobAttack',mobId:mob.id,damage});
}

function killMob(mob){
  const def=MOB_TYPES[mob.type];
  const pos=mob.mesh.position.clone();
  for(let d=0;d<def.dropCount;d++) for(const dropId of def.drops) spawnDrop(pos.x,pos.y+0.5,pos.z,dropId);
  scene.remove(mob.mesh);
  const idx=mobs.indexOf(mob); if(idx>=0)mobs.splice(idx,1);
  // Wake nearby sleeping choopers when a chooper is killed
  if(mob.type==='chooper'){
    for(const m of mobs){
      if(m.type==='chooper' && (m.state==='idle'||m.state==='disguise')){
        if(m.mesh.position.distanceTo(pos)<16){ m.state='provoked'; }
      }
    }
  }
}

function takeDamage(amount, cause){
  if (player.gameMode !== 'survival' || player.dead || amount <= 0) return;
  player.health = Math.max(0, player.health - amount);
  const df = document.getElementById('damage-flash');
  df.style.opacity = '1';
  setTimeout(()=> df.style.opacity = '0', 150);
  if (player.health <= 0){
    player.dead = true;
    player.air = 300;
    drownAccum = 0;
    document.getElementById('death-msg').textContent = cause || 'You died!';
    document.getElementById('death').style.display = 'flex';
    document.exitPointerLock();
  }
}

function updatePlayer(dt){
  if (player.dead) return;

  // Unstick: if player is inside a solid block, push upward until free
  if (collidesAt(player.pos.x, player.pos.y, player.pos.z)){
    const startY = player.pos.y;
    for (let step=0; step<20; step++){
      player.pos.y += 1;
      if (!collidesAt(player.pos.x, player.pos.y, player.pos.z)){
        player.vel.y = 0;
        break;
      }
    }
  }

  // Movement direction
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const speed = (keys['ShiftLeft']||keys['ShiftRight'])?2.2 : (player.inWater?3:4.8);
  const mv = new THREE.Vector3();
  if (keys['KeyW']) mv.add(fwd);
  if (keys['KeyS']) mv.sub(fwd);
  if (keys['KeyD']) mv.add(right);
  if (keys['KeyA']) mv.sub(right);
  if (mv.lengthSq()>0) mv.normalize().multiplyScalar(speed);
  player.vel.x = mv.x;
  player.vel.z = mv.z;

  if (player.fly){
    player.vel.y = 0;
    if (keys['Space']) player.vel.y = 8;
    if (keys['ShiftLeft']||keys['ShiftRight']) player.vel.y = -8;
  } else {
    player.vel.y -= 28*dt; // gravity
    if (player.inWater){
      player.vel.y *= 0.9;
      if (keys['Space']) player.vel.y = 3.5;
    } else {
      if (keys['Space'] && player.onGround){
        if (player.gameMode==='survival') player.fallStartY = player.pos.y;
        player.vel.y = 9; player.onGround=false;
      }
    }
    if (player.vel.y < -40) player.vel.y = -40;
  }

  // Axis-separated collision
  const nx = player.pos.x + player.vel.x*dt;
  if (!collidesAt(nx, player.pos.y, player.pos.z)) player.pos.x = nx;
  else player.vel.x = 0;
  const nz = player.pos.z + player.vel.z*dt;
  if (!collidesAt(player.pos.x, player.pos.y, nz)) player.pos.z = nz;
  else player.vel.z = 0;
  const ny = player.pos.y + player.vel.y*dt;
  // Record fall start before updating position (capture ground-level Y)
  if (player.onGround && player.gameMode==='survival' && !collidesAt(player.pos.x, ny, player.pos.z)){
    player.fallStartY = player.pos.y;
  }
  if (!collidesAt(player.pos.x, ny, player.pos.z)){
    player.pos.y = ny;
    player.onGround=false;
  } else {
    if (player.vel.y < 0){
      player.onGround = true;
      // Fall damage
      if (player.gameMode==='survival' && player.fallStartY !== null){
        const dist = player.fallStartY - player.pos.y;
        if (dist > 3) takeDamage(Math.floor(dist - 3), 'Fell from a high place');
        player.fallStartY = null;
      }
    }
    player.vel.y = 0;
  }

  // Fall out of world
  if (player.pos.y < -10){
    if (player.gameMode==='survival') takeDamage(player.health, 'Fell out of the world');
    else spawnPlayer();
  }

  player.inWater = inWaterAt(player.pos.x, player.pos.y, player.pos.z);

  // Drowning
  if (player.gameMode==='survival' && !player.dead){
    const headUnderwater = player.pos.y + player.eye <= SEA_LEVEL && player.inWater;
    if (headUnderwater){
      player.air--;
      if (player.air <= 0){
        player.air = 0;
        drownAccum += dt * 2; // 2 HP per second
        if (drownAccum >= 1){
          const dmg = Math.floor(drownAccum);
          drownAccum -= dmg;
          takeDamage(dmg, 'Drowned');
        }
      }
    } else {
      player.air = Math.min(300, player.air + 10);
      drownAccum = 0;
    }
  }

  // Hunger depletion
  if (player.gameMode==='survival' && !player.dead){
    player.hungerAccum += dt;
    if (player.hungerAccum >= 30){ player.hungerAccum -= 30; if(player.hunger>0) player.hunger--; }
    if (player.hunger <= 0){
      player.starveAccum += dt;
      if (player.starveAccum >= 4){ player.starveAccum -= 4; takeDamage(1,'Starved to death'); }
    } else { player.starveAccum = 0; }
    // Eating
    if (player.eatingItem){
      if (!player.rightMouseHeld){ player.eatingItem = null; }
      else if (performance.now()/1000 - player.eatingItem.startTime >= 1.6){
        const foodDef = BLOCKS[player.eatingItem.id];
        if (foodDef && foodDef.food) player.hunger = Math.min(player.maxHunger, player.hunger + foodDef.food);
        removeFromSlot(selectedSlot);
        updateHotbar();
        player.eatingItem = null;
      }
    }
  }

  camera.position.set(player.pos.x, player.pos.y+player.eye, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

// ---------- Chunk streaming ----------
function updateChunks(){
  const pcx = Math.floor(player.pos.x/CHUNK_SIZE);
  const pcz = Math.floor(player.pos.z/CHUNK_SIZE);
  // Generate / keep
  for (let dz=-RENDER_DIST; dz<=RENDER_DIST; dz++){
    for (let dx=-RENDER_DIST; dx<=RENDER_DIST; dx++){
      if (dx*dx+dz*dz > (RENDER_DIST+0.5)*(RENDER_DIST+0.5)) continue;
      const cx=pcx+dx, cz=pcz+dz;
      const k = chunkKey(cx,cz);
      if (!chunks.has(k)){
        // Restore modified blocks before regenerating
        const saved = modifiedChunks.get(k);
        const ch = generateChunk(cx,cz);
        if (saved) ch.blocks.set(saved);
        chunks.set(k, ch);
      }
    }
  }
  // Rebuild a few dirty per frame
  let rebuilt = 0;
  for (const [k,ch] of chunks){
    if (ch.dirty && rebuilt<3){
      const [cx,cz] = k.split(',').map(Number);
      const dx=cx-pcx, dz=cz-pcz;
      if (dx*dx+dz*dz <= (RENDER_DIST+0.5)*(RENDER_DIST+0.5)){
        buildChunkMesh(cx,cz);
        rebuilt++;
      }
    }
  }
  // Unload far — save modified blocks before deletion
  for (const k of chunks.keys()){
    const [cx,cz] = k.split(',').map(Number);
    const dx=cx-pcx, dz=cz-pcz;
    if (dx*dx+dz*dz > (RENDER_DIST+2)*(RENDER_DIST+2)){
      const ch = chunks.get(k);
      if (ch.mesh){ scene.remove(ch.mesh); ch.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose()}); }
      // Save modified blocks before discarding
      modifiedChunks.set(k, new Uint8Array(ch.blocks));
      chunks.delete(k);
    }
  }
  // Passive mob spawning (every 5 seconds)
  mobSpawnTimer += 0.016; // approximate dt since updateChunks doesn't receive dt
  if (mobSpawnTimer >= 5){
    mobSpawnTimer = 0;
    for (const [k] of chunks){
      const [cx,cz] = k.split(',').map(Number);
      const dx=cx-pcx, dz=cz-pcz;
      if(dx*dx+dz*dz>RENDER_DIST*RENDER_DIST) continue;
      for (const typeName of ['sheep','camel','reindeer']){
        const td = MOB_TYPES[typeName];
        let count=0;
        for(const m of mobs){ if(m.type===typeName){ const mcx=Math.floor(m.mesh.position.x/CHUNK_SIZE); const mcz=Math.floor(m.mesh.position.z/CHUNK_SIZE); if(mcx===cx&&mcz===cz)count++; } }
        if(count>=td.maxPerChunk) continue;
        const lx=Math.floor(Math.random()*CHUNK_SIZE), lz=Math.floor(Math.random()*CHUNK_SIZE);
        const wx=cx*CHUNK_SIZE+lx, wz=cz*CHUNK_SIZE+lz;
        const biome=biomeAt(wx,wz);
        if(!td.spawnBiomes||!td.spawnBiomes.includes(biome)) continue;
        if(Math.random()>0.15) continue;
        const h=heightAt(wx,wz);
        if(h<SEA_LEVEL) continue;
        if(isSolid(wx,h+1,wz)||isSolid(wx,h+2,wz)) continue;
        spawnMob(typeName,wx+0.5,h+1,wz+0.5);
      }
    }
  }
}

// ---------- Day/night ----------
let worldTime = 0.25; // 0..1 day cycle, 0.25 = noon
function updateSky(dt){
  worldTime = (worldTime + dt/dayLength) % 1;
  const sunAngle = worldTime*Math.PI*2 - Math.PI/2;
  const sunY = Math.sin(sunAngle), sunX = Math.cos(sunAngle);
  sun.position.set(sunX*100, sunY*100, 20);
  moon.position.set(-sunX*100, -sunY*100, -20);
  sunMesh.position.copy(camera.position).add(new THREE.Vector3(sunX*200, sunY*200, 40));
  moonMesh.position.copy(camera.position).add(new THREE.Vector3(-sunX*200, -sunY*200, -40));

  const day = Math.max(0, sunY);
  const dusk = Math.max(0, 1 - Math.abs(sunY)*4) * (sunY<0?0.5:1);
  const skyR = 0.1 + day*0.4 + dusk*0.4;
  const skyG = 0.1 + day*0.55 + dusk*0.2;
  const skyB = 0.2 + day*0.65 + dusk*0.2;
  renderer.setClearColor(new THREE.Color(skyR, skyG, skyB));
  scene.fog.color.setRGB(skyR, skyG, skyB);
  sun.intensity = 0.2 + day*0.9;
  moon.intensity = 0.1 + Math.max(0,-sunY)*0.3;
  hemi.intensity = 0.25 + day*0.5;
  ambient.intensity = 0.2 + day*0.15 + Math.max(0,-sunY)*0.1;
  stars.material.opacity = Math.max(0, -sunY*1.5);
}

// ---------- Debug / HUD ----------
let debug = false;
const hud = document.getElementById('hud');
function updateHUD(fps){
  const hit = raycast();
  if (hit){
    highlight.visible = true;
    highlight.position.set(hit.x+0.5, hit.y+0.5, hit.z+0.5);
  } else highlight.visible = false;

  let txt = '';
  if (debug){
    const biome = biomeAt(Math.floor(player.pos.x), Math.floor(player.pos.z));
    txt += `Voxelcraft (Three.js r128)\n`;
    txt += `FPS: ${fps.toFixed(0)}\n`;
    txt += `XYZ: ${player.pos.x.toFixed(2)} / ${player.pos.y.toFixed(2)} / ${player.pos.z.toFixed(2)}\n`;
    txt += `Chunk: ${Math.floor(player.pos.x/CHUNK_SIZE)}, ${Math.floor(player.pos.z/CHUNK_SIZE)}\n`;
    txt += `Biome: ${biome}\n`;
    txt += `Loaded chunks: ${chunks.size}\n`;
    txt += `Time: ${(worldTime*24).toFixed(2)}h\n`;
    txt += `Seed: ${SEED}\n`;
    txt += `${player.fly?'FLYING ':''}${player.inWater?'SWIMMING ':''}${player.onGround?'on ground':''}\n`;
    if (hit) txt += `Looking at: ${BLOCKS[hit.id].name} (${hit.x},${hit.y},${hit.z})`;
  } else {
    if (hit) txt = `Looking at: ${BLOCKS[hit.id].name}`;
  }
  hud.textContent = txt;
  hud.style.whiteSpace = 'pre';

  // Health bar (survival only)
  const heartsEl = document.getElementById('hearts');
  const airEl = document.getElementById('air-bar');
  if (player.gameMode === 'survival' && !player.dead){
    const full = Math.ceil(player.health / 2);
    const half = player.health % 2 === 1 ? 1 : 0;
    const empty = 10 - full - half;
    let h = '';
    for (let i=0;i<full;i++) h += '<span class="full">\u2764</span>';
    if (half) h += '<span class="half">\u2764</span>';
    for (let i=0;i<empty;i++) h += '<span class="empty">\u2764</span>';
    heartsEl.innerHTML = h;
    heartsEl.style.display = 'block';
    // Hunger bar
    const hungerEl = document.getElementById('hunger-bar');
    const hf = Math.ceil(player.hunger/2);
    const hh = player.hunger%2===1?1:0;
    const he = 10-hf-hh;
    let hu='';
    for(let i=0;i<hf;i++) hu+='<span class="full">\u{1F356}</span>';
    if(hh) hu+='<span class="full">\u{1F356}</span>';
    for(let i=0;i<he;i++) hu+='<span class="empty">\u{1F356}</span>';
    hungerEl.innerHTML=hu;
    hungerEl.style.display='block';
    // Air bar
    if (player.air < 300 && player.inWater){
      const bubbles = Math.ceil(player.air / 30);
      airEl.textContent = '🫧'.repeat(bubbles);
      airEl.style.display = 'block';
    } else {
      airEl.style.display = 'none';
    }
  } else {
    heartsEl.style.display = 'none';
    document.getElementById('hunger-bar').style.display = 'none';
    airEl.style.display = 'none';
  }

  // Break progress bar
  const breakBar = document.getElementById('break-bar');
  const breakFill = document.getElementById('break-fill');
  if (breaking && player.gameMode==='survival'){
    const pct = Math.min(100, (breaking.progress / breaking.hardness) * 100);
    breakFill.style.width = pct + '%';
    breakBar.style.display = 'block';
  } else {
    breakBar.style.display = 'none';
  }
}

// ---------- Save/Load ----------
function saveGame(){
  const data = {
    seed: SEED,
    pos: [player.pos.x, player.pos.y, player.pos.z],
    yaw: player.yaw, pitch: player.pitch,
    hotbar: creativeHotbar,
    inventory: inventory,
    gameMode: player.gameMode,
    health: player.health,
    air: player.air,
    hunger: player.hunger,
    savedHealth: savedSurvivalHealth,
    savedAir: savedSurvivalAir,
    savedHunger: savedSurvivalHunger,
    selectedSlot: selectedSlot,
    craftGrid: craftGrid,
    craftSize: craftSize,
    smelterInput: smelterInput,
    smelterFuel: smelterFuel,
    smelterOutput: smelterOutput,
    smelterProgress: smelterProgress,
    smelterFuelLeft: smelterFuelLeft,
    settings: { renderDist: RENDER_DIST, mouseSens: mouseSens, fov: camera.fov, dayLength: dayLength },
    mobs: mobs.map(m=>({type:m.type,pos:[m.mesh.position.x,m.mesh.position.y,m.mesh.position.z],health:m.health,state:m.state})),
    chunks: {}
  };
  // Save both currently loaded and previously modified chunks
  const allChunks = new Map(modifiedChunks);
  for (const [k,ch] of chunks) allChunks.set(k, ch.blocks);
  for (const [k,blocks] of allChunks){
    let bin = '';
    for (let i=0;i<blocks.length;i++) bin += String.fromCharCode(blocks[i]);
    data.chunks[k] = btoa(bin);
  }
  try{
    localStorage.setItem('voxelcraft_save', JSON.stringify(data));
    flash('Game saved');
  }catch(e){ flash('Save failed: '+e.message); }
}
function loadGame(){
  const s = localStorage.getItem('voxelcraft_save');
  if (!s){ flash('No save found'); return; }
  try{
    const data = JSON.parse(s);
    if (data.seed !== SEED){ flash('Save is for different seed'); return; }
    // Clear current
    for (const ch of chunks.values()) if(ch.mesh){scene.remove(ch.mesh); ch.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose()});}
    chunks.clear();
    for (const k in data.chunks){
      const bin = atob(data.chunks[k]);
      const arr = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      chunks.set(k, { blocks:arr, mesh:null, dirty:true });
    }
    player.pos.set(data.pos[0], data.pos[1], data.pos[2]);
    player.yaw = data.yaw; player.pitch = data.pitch;
    if (data.hotbar) for (let i=0;i<data.hotbar.length;i++) creativeHotbar[i]=data.hotbar[i];
    if (data.inventory){ for (let i=0;i<36;i++) inventory[i]=data.inventory[i]||null; }
    if (data.selectedSlot !== undefined) selectedSlot = data.selectedSlot;
    if (data.craftGrid){ craftGrid = data.craftGrid; craftSize = data.craftSize || 2; checkRecipe(); }
    if (data.smelterInput !== undefined) smelterInput = data.smelterInput;
    if (data.smelterFuel !== undefined) smelterFuel = data.smelterFuel;
    if (data.smelterOutput !== undefined) smelterOutput = data.smelterOutput;
    if (data.smelterProgress !== undefined) smelterProgress = data.smelterProgress;
    if (data.smelterFuelLeft !== undefined) smelterFuelLeft = data.smelterFuelLeft;
    if (data.gameMode){ player.gameMode = data.gameMode; player.health = data.health||20; player.air = data.air||300; player.dead = false; }
    if (data.hunger !== undefined) player.hunger = data.hunger;
    if (data.savedHealth !== undefined){ savedSurvivalHealth = data.savedHealth; savedSurvivalAir = data.savedAir||300; savedSurvivalHunger = data.savedHunger||20; }
    if (data.settings){
      RENDER_DIST = data.settings.renderDist || 4;
      mouseSens = data.settings.mouseSens || 0.0025;
      camera.fov = data.settings.fov || 75; camera.updateProjectionMatrix();
      dayLength = data.settings.dayLength || 240;
      document.getElementById('opt-render').value = RENDER_DIST; document.getElementById('val-render').textContent = RENDER_DIST;
      document.getElementById('opt-sens').value = Math.round(mouseSens/0.0005); document.getElementById('val-sens').textContent = Math.round(mouseSens/0.0005);
      document.getElementById('opt-fov').value = camera.fov; document.getElementById('val-fov').textContent = camera.fov;
      document.getElementById('opt-daylen').value = dayLength; document.getElementById('val-daylen').textContent = dayLength;
    }
    // Restore mobs
    if(data.mobs){
      for(const m of mobs){ scene.remove(m.mesh); }
      mobs.length=0;
      for(const m of data.mobs){ const mob=spawnMob(m.type,m.pos[0],m.pos[1],m.pos[2]); mob.health=m.health; mob.state=m.state; }
    }
    updateHotbar();
    flash('Game loaded');
  }catch(e){ flash('Load failed: '+e.message); }
}
let flashTimer=0, flashText='';
function flash(msg){ flashText=msg; flashTimer=2; }

// ---------- Main loop ----------
let last = performance.now(), fps=60, acc=0, frames=0, fpsT=0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  frames++; fpsT += dt;
  if (fpsT>0.5){ fps = frames/fpsT; frames=0; fpsT=0; }

  if (locked){
    updatePlayer(dt);
    updateBreaking(dt);
    updateSky(dt);
    updateDrops(dt);
    updateMobs(dt);
    // Chooper spawning (day and night)
    chooperSpawnTimer+=dt;
    if(chooperSpawnTimer>=15){
      chooperSpawnTimer=0;
      let cc=0;
      for(const m of mobs) if(m.type==='chooper'&&m.mesh.position.distanceTo(player.pos)<RENDER_DIST*CHUNK_SIZE) cc++;
      if(cc<4){
        const a=Math.random()*Math.PI*2, d=10+Math.random()*15;
        const sx=player.pos.x+Math.cos(a)*d, sz=player.pos.z+Math.sin(a)*d;
        const sh=heightAt(Math.floor(sx),Math.floor(sz));
        if(sh>=SEA_LEVEL&&!isSolid(Math.floor(sx),sh+1,Math.floor(sz))) spawnMob('chooper',Math.floor(sx)+0.5,sh+1,Math.floor(sz)+0.5);
      }
    }
    updateSmelter(dt);
    if (smelterOpen) renderSmelter();
    // Clouds drift
    cloudGroup.position.x = (cloudGroup.position.x + dt*2) % 400;
    cloudGroup.position.z = camera.position.z*0.1;
    cloudGroup.position.x = camera.position.x*0.1 + (now*0.001 % 100);
    updateHUD(fps);
  }

  // Chunk updates and multiplayer — always run
  updateChunks();
  if (mpMode !== 'none'){
    mpBroadcastState();
    updateRemotePlayers(dt);
    renderChat();
  }

  if (flashTimer>0){
    flashTimer -= dt;
    hud.textContent += '\n\n>> '+flashText;
  }

  renderer.clear();
  
  // Underwater effect logic
  const cameraUnderwater = camera.position.y <= SEA_LEVEL;
  if (cameraUnderwater) {
    scene.fog.color.setHex(0x204060); // Dark blue fog
    scene.fog.density = 0.03;
    scene.fog.near = 2;
    scene.fog.far = 40;
  } else {
    scene.fog.color.setHex(0x87CEEB); // Sky blue fog
    scene.fog.near = 20;
    scene.fog.far = RENDER_DIST * CHUNK_SIZE;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// MULTIPLAYER
// ============================================================
let gameStarted = false;
let mpMode = 'none'; // 'none' | 'host' | 'guest'
let mpPeer = null;
let mpConns = {};   // {peerId: DataConnection}
let mpPlayers = {};  // {peerId: {pos, yaw, pitch, name}}
let mpMeshes = {};   // {peerId: THREE.Group}
let mpName = 'Player';
let mpHostId = null;
const MP_COLORS = [0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c,0xe67e22,0xe84393];
let mpColorIdx = 0;

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function startGame(){

  document.getElementById('lobby').style.display = 'none';

// Create a 3D model for a remote player
function createPlayerMesh(name, color){
  const group = new THREE.Group();
  // Body
  const bodyGeo = new THREE.BoxGeometry(0.6, 1.8, 0.3);
  const bodyMat = new THREE.MeshLambertMaterial({color});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.9;
  group.add(body);
  // Nametag sprite
  const canvas2 = document.createElement('canvas');
  canvas2.width = 256; canvas2.height = 64;
  const ctx2 = canvas2.getContext('2d');
  ctx2.font = 'bold 32px monospace';
  ctx2.textAlign = 'center';
  ctx2.fillStyle = 'rgba(0,0,0,0.5)';
  ctx2.fillRect(0, 0, 256, 64);
  ctx2.fillStyle = '#fff';
  ctx2.fillText(name, 128, 44);
  const tex = new THREE.CanvasTexture(canvas2);
  const spriteMat = new THREE.SpriteMaterial({map: tex, transparent: true});
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(1.5, 0.4, 1);
  sprite.position.y = 2.1;
  group.add(sprite);
  scene.add(group);
  return group;
}

function removePlayerMesh(peerId){
  if (mpMeshes[peerId]){
    scene.remove(mpMeshes[peerId]);
    delete mpMeshes[peerId];
  }
}

// Send a message to all connected peers
function mpSend(msg){
  const data = JSON.stringify(msg);
  for (const id in mpConns){
    try { mpConns[id].send(data); } catch(e){}
  }
}

// Send block change to peers
function mpSendBlock(wx,wy,wz,id){
  if (mpMode === 'none') return;
  mpSend({type:'block', x:wx, y:wy, z:wz, id});
}

// Broadcast player state (called from game loop)
function mpBroadcastState(){
  if (mpMode === 'none') return;
  const myState = {
    pos: [player.pos.x, player.pos.y, player.pos.z],
    yaw: player.yaw,
    pitch: player.pitch,
    name: mpName
  };
  if (mpMode === 'host'){
    // Host sends all players' state to everyone
    const allPlayers = {};
    allPlayers[mpPeerId] = myState;
    for (const id in mpPlayers) allPlayers[id] = mpPlayers[id];
    const mobStates = mobs.map(m=>({type:m.type,id:m.id,pos:[m.mesh.position.x,m.mesh.position.y,m.mesh.position.z],health:m.health,state:m.state}));
    mpSend({type:'state', players: allPlayers, worldTime, mobs: mobStates});
  } else {
    // Guest sends own state to host
    for (const id in mpConns){
      try { mpConns[id].send(JSON.stringify({type:'state', player: myState})); } catch(e){}
    }
  }
}

// Handle incoming data
function mpHandleData(peerId, data){
  let msg;
  try { msg = JSON.parse(data); } catch(e){ return; }

  if (msg.type === 'state'){
    if (mpMode === 'host'){
      // Host receives guest state, stores it, rebroadcasts to all
      mpPlayers[peerId] = msg.player;
    } else {
      // Guest receives all player states from host
      for (const id in msg.players){
        if (id === mpPeerId) continue; // skip self
        mpPlayers[id] = msg.players[id];
      }
      // Remove players no longer in the list
      for (const id in mpMeshes){
        if (!msg.players[id] && id !== mpPeerId){
          removePlayerMesh(id);
          delete mpPlayers[id];
        }
      }
      // Sync world time from host
      if (msg.worldTime !== undefined) worldTime = msg.worldTime;
      // Sync mobs from host
      if (msg.mobs){
        for(const ms of msg.mobs){
          let existing=mobs.find(m=>m.id===ms.id);
          if(!existing){ existing=spawnMob(ms.type,ms.pos[0],ms.pos[1],ms.pos[2]); existing.id=ms.id; }
          existing.mesh.position.x+=(ms.pos[0]-existing.mesh.position.x)*0.3;
          existing.mesh.position.y+=(ms.pos[1]-existing.mesh.position.y)*0.3;
          existing.mesh.position.z+=(ms.pos[2]-existing.mesh.position.z)*0.3;
          existing.health=ms.health; existing.state=ms.state;
        }
        const hostIds=new Set(msg.mobs.map(m=>m.id));
        for(let i=mobs.length-1;i>=0;i--){ if(!hostIds.has(mobs[i].id)){ scene.remove(mobs[i].mesh); mobs.splice(i,1); } }
      }
    }
  }
  else if (msg.type === 'welcome'){
    // Guest receives: host info — create host mesh and sync time
    const color = msg.color || MP_COLORS[mpColorIdx++ % MP_COLORS.length];
    mpMeshes[msg.hostId] = createPlayerMesh(msg.hostName, color);
    const hp = msg.hostPos || [0,50,0];
    mpPlayers[msg.hostId] = {pos: hp, yaw: msg.hostYaw || 0, pitch:0, name:msg.hostName};
    // Sync world time
    if (msg.worldTime !== undefined) worldTime = msg.worldTime;
    if (msg.dayLength !== undefined) dayLength = msg.dayLength;
    // Teleport guest within 20 blocks of host
    if (hp && gameStarted){
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 10;
      const gx = hp[0] + Math.cos(angle) * dist;
      const gz = hp[2] + Math.sin(angle) * dist;
      const gy = heightAt(Math.floor(gx), Math.floor(gz)) + 2;
      player.pos.set(gx + 0.5, gy, gz + 0.5);
    }
  }
  else if (msg.type === 'gameStart'){
    // Host started the game
    startGame();
  }
  else if (msg.type === 'playerJoin'){
    // Guest receives: another player joined
    if (!mpMeshes[msg.id]){
      const color = MP_COLORS[mpColorIdx++ % MP_COLORS.length];
      mpMeshes[msg.id] = createPlayerMesh(msg.name, color);
      mpPlayers[msg.id] = {pos:[0,50,0], yaw:0, pitch:0, name:msg.name};
    }
  }
  else if (msg.type === 'block'){
    // Block change from peer — apply locally without re-broadcasting
    _origSetBlock(msg.x, msg.y, msg.z, msg.id);
  }
  else if (msg.type === 'chat'){
    addChatMessage(msg.name, msg.text);
  }
  else if (msg.type === 'playerLeave'){
    removePlayerMesh(msg.id);
    delete mpPlayers[msg.id];
    delete mpConns[msg.id];
  }
  else if (msg.type === 'pvpDamage'){
    if (msg.targetId === mpPeerId) takeDamage(msg.damage, 'Killed by '+(mpPlayers[peerId]?.name||'another player'));
  }
  else if (msg.type === 'mobAttack'){
    // Host validates mob attack from guest
    if (mpMode==='host'){
      const mob=mobs.find(m=>m.id===msg.mobId);
      if(mob){ mob.health-=msg.damage; if(mob.health<=0)killMob(mob); }
    }
  }
  else if (msg.type === 'dropItem'){
    spawnDrop(msg.x, msg.y, msg.z, msg.blockId);
  }
  else if (msg.type === 'itemPickup'){
    if (msg.targetId===mpPeerId){ addToInventory(msg.blockId); updateHotbar(); }
  }
}

function updateMPPlayerCount(){
  const count = Object.keys(mpConns).length;
  document.getElementById('mp-player-count').textContent =
    count === 0 ? 'Waiting for players...' :
    count + ' player' + (count>1?'s':'') + ' connected';
}

// Wire up connection events — conn is a WSConn wrapper: {id, send(), on(), close()}
function setupConnection(conn){
  conn.on('data', (data) => {
    if (typeof data === 'string') mpHandleData(conn.id, data);
    else if (data instanceof ArrayBuffer || data instanceof Blob){
      if (data instanceof Blob) data.text().then(t => mpHandleData(conn.id, t));
      else mpHandleData(conn.id, new TextDecoder().decode(data));
    }
  });
  conn.on('close', ()=>{
    const leaveName = (mpPlayers[conn.id]?.name) || 'A player';
    removePlayerMesh(conn.id);
    delete mpPlayers[conn.id];
    delete mpConns[conn.id];
    addChatMessage('System', leaveName + ' disconnected');
    if (mpMode === 'host') mpSend({type:'playerLeave', id: conn.id});
    updateMPPlayerCount();
  });
}

// WebSocket connection wrapper — relay messages through the server
let mpWS = null;
let mpPeerId = null;

function wsConn(peerId, target){
  const listeners = {};
  return {
    id: peerId,
    send(data){
      if (mpWS && mpWS.readyState === 1){
        mpWS.send(JSON.stringify({type:'relay', to: target, data}));
      }
    },
    on(evt, fn){ (listeners[evt] = listeners[evt] || []).push(fn); },
    _fire(evt, ...args){ (listeners[evt]||[]).forEach(fn=>fn(...args)); },
    close(){}
  };
}

function mpConnect(callback){
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${protocol}://${location.host}`);
  ws.onopen = () => callback(null, ws);
  ws.onerror = () => callback('Connection failed');
  ws.onclose = () => {
    if (mpMode !== 'none'){
      addChatMessage('System', 'Disconnected from server');
    }
  };
}

// Host a room via WebSocket server
function hostRoom(){
  document.getElementById('lobby-status').textContent = 'Connecting to server...';
  mpConnect((err, ws) => {
    if (err){
      document.getElementById('lobby-status').textContent = 'Failed to connect to server. Is it running?';
      return;
    }
    mpWS = ws;
    ws.send(JSON.stringify({type:'host', seed: SEED}));

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.type === 'hosted'){
        mpPeerId = msg.id;
        mpMode = 'host';
        mpHostId = mpPeerId;
        document.getElementById('room-code').textContent = msg.code;
        showLobbyStep(3);
        addChatMessage('System', 'Room created. Waiting for players...');
      }
      else if (msg.type === 'guestJoin'){
        // New guest connected
        const conn = wsConn(msg.id, msg.id);
        mpConns[msg.id] = conn;
        setupConnection(conn);
        // Create guest mesh and player data
        const color = MP_COLORS[mpColorIdx++ % MP_COLORS.length];
        mpMeshes[msg.id] = createPlayerMesh(msg.name, color);
        const sh = heightAt(0, 0);
        mpPlayers[msg.id] = {pos:[0.5, sh+2, 0.5], yaw:0, pitch:0, name:msg.name};
        updateMPPlayerCount();
        // Send welcome with host info, position, and world time
        conn.send(JSON.stringify({
          type:'welcome', hostId: mpPeerId, hostName: mpName,
          color: MP_COLORS[mpColorIdx++ % MP_COLORS.length],
          seed: SEED,
          hostPos: [player.pos.x, player.pos.y, player.pos.z],
          hostYaw: player.yaw,
          worldTime: worldTime,
          dayLength: dayLength
        }));
      }
      else if (msg.type === 'relay'){
        // Game message from a guest
        const fromId = msg.from;
        if (!mpConns[fromId]){
          const conn = wsConn(fromId, fromId);
          mpConns[fromId] = conn;
          setupConnection(conn);
        }
        mpConns[fromId]._fire('data', msg.data);
      }
      else if (msg.type === 'playerLeave'){
        const conn = mpConns[msg.id];
        if (conn) conn._fire('close');
      }
    };

    mpPeer = {destroy(){ ws.close(); mpWS = null; }};
  });
}

// Join a room via WebSocket server
function joinRoom(code){
  const targetCode = code.trim().toUpperCase();
  document.getElementById('lobby-status').textContent = 'Connecting to server...';
  mpConnect((err, ws) => {
    if (err){
      document.getElementById('lobby-status').textContent = 'Failed to connect to server. Is it running?';
      return;
    }
    mpWS = ws;
    ws.send(JSON.stringify({type:'join', code: targetCode, name: mpName}));

    let connected = false;
    const timeout = setTimeout(()=>{
      if (!connected){
        document.getElementById('lobby-status').textContent = 'Connection timed out. Is the host still waiting?';
        ws.close(); mpWS = null;
      }
    }, 10000);

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.type === 'joined'){
        connected = true;
        clearTimeout(timeout);
        mpPeerId = msg.id;
        mpMode = 'guest';
        mpHostId = msg.hostId;
        document.getElementById('lobby-status').textContent = 'Connected!';
        // Set seed and clear chunks before starting
        SEED = msg.seed;
        for (const [k, ch] of chunks){
          if (ch.mesh){ scene.remove(ch.mesh); ch.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose()}); }
        }
        chunks.clear();
        modifiedChunks.clear();
        updateChunks();
        for (const [k] of chunks){
          const [cx,cz] = k.split(',').map(Number);
          buildChunkMesh(cx,cz);
        }
        // Create host connection wrapper
        const conn = wsConn(msg.hostId, 'host');
        mpConns[msg.hostId] = conn;
        setupConnection(conn);
        // Create a fake connection for self so mpSend works
        startGame();
      }
      else if (msg.type === 'error'){
        document.getElementById('lobby-status').textContent = msg.msg;
        clearTimeout(timeout);
      }
      else if (msg.type === 'relay'){
        // Game message from host or another guest
        const fromId = msg.from;
        if (!mpConns[fromId]){
          const conn = wsConn(fromId, fromId);
          mpConns[fromId] = conn;
          setupConnection(conn);
        }
        mpConns[fromId]._fire('data', msg.data);
      }
      else if (msg.type === 'playerJoin'){
        if (!mpMeshes[msg.id]){
          const color = MP_COLORS[mpColorIdx++ % MP_COLORS.length];
          mpMeshes[msg.id] = createPlayerMesh(msg.name, color);
          mpPlayers[msg.id] = {pos:[0,50,0], yaw:0, pitch:0, name:msg.name};
          // Create connection wrapper for this guest
          if (!mpConns[msg.id]){
            const conn = wsConn(msg.id, msg.id);
            mpConns[msg.id] = conn;
            setupConnection(conn);
          }
        }
      }
      else if (msg.type === 'playerLeave'){
        const conn = mpConns[msg.id];
        if (conn) conn._fire('close');
      }
      else if (msg.type === 'hostDisconnect'){
        addChatMessage('System', 'Host disconnected');
        for (const id in mpMeshes) removePlayerMesh(id);
        mpPlayers = {};
        mpMeshes = {};
        mpConns = {};
        mpMode = 'none';
      }
    };

    mpPeer = {destroy(){ ws.close(); mpWS = null; clearTimeout(timeout); }};
  });
}

// Update remote player meshes each frame
function updateRemotePlayers(dt){
  for (const id in mpPlayers){
    const p = mpPlayers[id];
    const mesh = mpMeshes[id];
    if (!mesh || !p || !p.pos) continue;
    // Smooth interpolation
    mesh.position.x += (p.pos[0] - mesh.position.x) * Math.min(1, dt * 10);
    mesh.position.y += (p.pos[1] - mesh.position.y) * Math.min(1, dt * 10);
    mesh.position.z += (p.pos[2] - mesh.position.z) * Math.min(1, dt * 10);
    mesh.rotation.y = p.yaw || 0;
  }
}

// Chat system
const chatMessages = [];
let chatOpen = false;
const chatColors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393'];
let chatColorMap = {};
let chatColorIdx = 0;

function addChatMessage(name, text){
  if (!chatColorMap[name]) chatColorMap[name] = chatColors[chatColorIdx++ % chatColors.length];
  chatMessages.push({name, text, color: chatColorMap[name], time: Date.now()});
  if (chatMessages.length > 50) chatMessages.shift();
  renderChat();
}

function renderChat(){
  const overlay = document.getElementById('chat-overlay');
  overlay.innerHTML = '';
  const now = Date.now();
  const visible = chatMessages.filter(m => now - m.time < 20000 || chatOpen);
  for (const m of visible){
    const p = document.createElement('p');
    p.innerHTML = '<span style="color:' + m.color + '">' + m.name + '</span>: ' + m.text;
    if (!chatOpen && now - m.time > 10000) p.style.opacity = Math.max(0, 1 - (now - m.time - 10000) / 10000);
    overlay.appendChild(p);
  }
  overlay.scrollTop = overlay.scrollHeight;
}

function openChat(){
  if (mpMode === 'none') return;
  chatOpen = true;
  const wrap = document.getElementById('chat-input-wrap');
  const input = document.getElementById('chat-input');
  wrap.style.display = 'block';
  input.value = '';
  input.focus();
  document.exitPointerLock();
}

function closeChat(){
  chatOpen = false;
  document.getElementById('chat-input-wrap').style.display = 'none';
  if (gameStarted) canvas.requestPointerLock();
}

// Patch setBlock to broadcast changes in multiplayer
const _origSetBlock = setBlock;
setBlock = function(wx,wy,wz,id){
  _origSetBlock(wx,wy,wz,id);
  if (mpMode !== 'none') mpSendBlock(wx,wy,wz,id);
};
